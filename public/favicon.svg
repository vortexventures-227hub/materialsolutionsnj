<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 40" fill="#E8A000">
  <!-- Forklift body -->
  <rect x="10" y="18" width="22" height="14" rx="2"/>
  <!-- Cab / operator area -->
  <rect x="24" y="10" width="8" height="12" rx="1.5"/>
  <!-- Mast vertical -->
